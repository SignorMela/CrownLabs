apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: standard-per-user-policy
  namespace: p7-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: standard-gui-route
  oidc:
    provider:
      issuer: https://auth.crownlabs.polito.it/auth/realms/crownlabs
    clientID: user-instances
    clientSecret:
      name: oidc-client-secret
    scopes:
      - openid
      - profile
      - email
    forwardAccessToken: true
    redirectURL: https://crownlabs.polito.it/oauth2/callback
  jwt:
    providers:
      - name: keycloak
        issuer: https://auth.crownlabs.polito.it/auth/realms/crownlabs
        audiences:
          - user-instances
        remoteJWKS:
          uri: https://auth.crownlabs.polito.it/auth/realms/crownlabs/protocol/openid-connect/certs
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-admin-group
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: groups
                valueType: StringArray
                values:
                  - /crownlabs-admin
      - name: allow-specific-user
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: preferred_username
                valueType: String
                values:
                  - federico.farci
